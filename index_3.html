<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Õppenädal</title>
<style>
  /* Fikseeritud tume teema — sobib Notioni tumeda taustaga.
     Kõik värvid on siin. Muuda neid ja kogu leht muutub kaasa. */
  :root {
    --bg:     #191919;   /* taust — sama, mis Notioni tume leht */
    --text:   #f3eef1;   /* suur number */
    --muted:  #a3959d;   /* "/ 16", semestri nimi, alumine rida */
    --accent: #f472b6;   /* sõna ÕPPENÄDAL ja käimasolev nädal */
    --done:   #70304e;   /* läbitud nädalad */
    --track:  #37333a;   /* tulemata nädalad */
  }
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
  }

  body {
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    color: var(--text);
    display: flex;
    align-items: center;
    padding: 16px 18px;
  }

  .card { width: 100%; max-width: 480px; }

  .eyebrow {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 8px;
  }

  .row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 13px;
  }

  .big {
    font-size: 36px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  .of {
    font-size: 17px;
    font-weight: 500;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .sem {
    font-size: 13px;
    color: var(--muted);
    margin-left: auto;
    white-space: nowrap;
  }

  .bar {
    display: flex;
    gap: 3px;
    margin-bottom: 10px;
  }

  .seg {
    flex: 1;
    height: 8px;
    border-radius: 2px;
    background: var(--track);
  }
  .seg.done    { background: var(--done); }
  .seg.current { background: var(--accent); }

  .foot {
    font-size: 12px;
    color: var(--muted);
  }

  .break .big { font-size: 24px; }
  .break .sem { margin-left: 0; }

  @media (max-width: 380px) {
    .sem { display: none; }
    .big { font-size: 30px; }
  }
</style>
</head>
<body>

<div class="card" id="card">
  <p class="eyebrow" id="eyebrow">Õppenädal</p>
  <div class="row">
    <span class="big" id="big">–</span>
    <span class="of"  id="of"></span>
    <span class="sem" id="sem"></span>
  </div>
  <div class="bar" id="bar"></div>
  <div class="foot" id="foot"></div>
</div>

<script>
// ---------------------------------------------------------------------------
// SEADED — lisa siia uued semestrid, kui õppeaasta vahetub
// ---------------------------------------------------------------------------
const WEEKS = 16;

const SEMESTERS = [
  { name: "sügissemester 2026/27", start: "2026-08-31" },
  { name: "kevadsemester 2026/27", start: "2027-02-01" },
  // { name: "sügissemester 2027/28", start: "2027-08-30" },
  // { name: "kevadsemester 2027/28", start: "2028-01-31" },
];
// ---------------------------------------------------------------------------

const DAY = 86400000;
const LAST = WEEKS * 7 - 1;          // 111 = viimane õppepäev algusest lugedes

function midnight(d) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
}

function parse(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).getTime();
}

// Math.round neelab suveaja tunnihüppe ära — ilma selleta kaoks semestri
// viimane päev ära, sest august on UTC+3 ja detsember UTC+2.
function daysBetween(a, b) {
  return Math.round((b - a) / DAY);
}

function render() {
  const today = midnight(new Date());
  const card  = document.getElementById("card");

  let week = 0, footText = "", isBreak = false, semName = "";

  const active = SEMESTERS.find(s => {
    const d = daysBetween(parse(s.start), today);
    return d >= 0 && d <= LAST;
  });

  if (active) {
    const d = daysBetween(parse(active.start), today);
    week = Math.floor(d / 7) + 1;
    const left = LAST - d + 1;
    semName = active.name;
    footText = "Semestri lõpuni " + left + (left === 1 ? " päev" : " päeva") + ".";
  } else {
    isBreak = true;
    const next = SEMESTERS
      .filter(s => daysBetween(today, parse(s.start)) > 0)
      .sort((a, b) => parse(a.start) - parse(b.start))[0];

    if (next) {
      const days = daysBetween(today, parse(next.start));
      semName = "järgmisena " + next.name;
      footText = "Algab " + next.start.split("-").reverse().join(".") +
                 " — " + days + " päeva pärast.";
    } else {
      footText = "Lisa uued semestrid index.html faili.";
    }
  }

  card.classList.toggle("break", isBreak);
  document.getElementById("eyebrow").textContent = isBreak ? "Vaheaeg" : "Õppenädal";
  document.getElementById("big").textContent     = isBreak ? "Vaheaeg" : String(week);
  document.getElementById("of").textContent      = isBreak ? "" : "/ " + WEEKS;
  document.getElementById("sem").textContent     = semName;
  document.getElementById("foot").textContent    = footText;

  const bar = document.getElementById("bar");
  bar.innerHTML = "";
  for (let i = 1; i <= WEEKS; i++) {
    const seg = document.createElement("div");
    seg.className = "seg" + (!isBreak && i < week ? " done" : "") +
                            (!isBreak && i === week ? " current" : "");
    bar.appendChild(seg);
  }
}

render();
// Uuenda iga minut, et lahtijäetud vahelehel ei jääks eilne seis ekraanile
setInterval(render, 60000);
</script>

</body>
</html>
