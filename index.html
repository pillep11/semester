<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Õppenädal</title>
<style>
  :root {
    --text:   #1b1a1f;
    --muted:  #6b6875;
    --accent: #c2410c;
    --track:  #dedbe4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text:   #ecebf0;
      --muted:  #9d9aa8;
      --accent: #fb923c;
      --track:  #3a3842;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;        /* laseb Notioni enda taustal läbi paista */
  }

  body {
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 14px 16px;
  }

  .card { width: 100%; max-width: 460px; }

  .eyebrow {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 6px;
  }

  .row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }

  .big {
    font-size: 34px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }

  .of {
    font-size: 16px;
    font-weight: 500;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .sem {
    font-size: 13px;
    color: var(--muted);
    margin-left: auto;
  }

  .bar {
    display: flex;
    gap: 3px;
    margin-bottom: 9px;
  }

  .seg {
    flex: 1;
    height: 8px;
    border-radius: 2px;
    background: var(--track);
  }
  .seg.done    { background: var(--accent); opacity: 0.45; }
  .seg.current { background: var(--accent); opacity: 1; }

  .foot {
    font-size: 12px;
    color: var(--muted);
  }

  /* Vaheaja kuju */
  .break .big { font-size: 22px; }
</style>
</head>
<body>

<div class="card" id="card">
  <p class="eyebrow" id="eyebrow">Õppenädal</p>
  <div class="row">
    <span class="big" id="big">–</span>
    <span class="of"  id="of"></span>
    <span class="sem" id="sem"></span>
  </div>
  <div class="bar" id="bar"></div>
  <div class="foot" id="foot"></div>
</div>

<script>
// ---------------------------------------------------------------------------
// SEADED — lisa siia uued semestrid, kui õppeaasta vahetub
// ---------------------------------------------------------------------------
const WEEKS = 16;

const SEMESTERS = [
  { name: "sügissemester 2026/27", start: "2026-08-31" },
  { name: "kevadsemester 2026/27", start: "2027-02-01" },
  // { name: "sügissemester 2027/28", start: "2027-08-30" },
  // { name: "kevadsemester 2027/28", start: "2028-01-31" },
];
// ---------------------------------------------------------------------------

const DAY = 86400000;

function midnight(d) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
}

function parse(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).getTime();
}

// Math.round neelab suveaja tunnihüppe ära — ilma selleta kaob semestri
// viimane päev ära, kui algus ja lõpp jäävad eri ajavööndisse.
function daysBetween(a, b) {
  return Math.round((b - a) / DAY);
}

function render() {
  const today = midnight(new Date());
  const LAST = WEEKS * 7 - 1;          // 111 = viimane õppepäev nihkena

  const eyebrow = document.getElementById("eyebrow");
  const big     = document.getElementById("big");
  const of      = document.getElementById("of");
  const sem     = document.getElementById("sem");
  const bar     = document.getElementById("bar");
  const foot    = document.getElementById("foot");
  const card    = document.getElementById("card");

  let week = 0, footText = "", isBreak = false, semName = "";

  const active = SEMESTERS.find(s => {
    const d = daysBetween(parse(s.start), today);
    return d >= 0 && d <= LAST;
  });

  if (active) {
    const d = daysBetween(parse(active.start), today);
    week = Math.floor(d / 7) + 1;
    const left = LAST - d + 1;
    semName = active.name;
    footText = "Semestri lõpuni " + left + (left === 1 ? " päev" : " päeva") + ".";
  } else {
    isBreak = true;
    const next = SEMESTERS
      .filter(s => daysBetween(today, parse(s.start)) > 0)
      .sort((a, b) => parse(a.start) - parse(b.start))[0];

    if (next) {
      const days = daysBetween(today, parse(next.start));
      semName = next.name;
      footText = "Algab " + next.start.split("-").reverse().join(".") +
                 " — " + days + " päeva pärast.";
    } else {
      semName = "";
      footText = "Lisa uued semestrid index.html faili.";
    }
  }

  card.classList.toggle("break", isBreak);
  eyebrow.textContent = isBreak ? "Vaheaeg" : "Õppenädal";
  big.textContent = isBreak ? "Vaheaeg" : String(week);
  of.textContent  = isBreak ? "" : "/ " + WEEKS;
  sem.textContent = semName;
  foot.textContent = footText;

  bar.innerHTML = "";
  for (let i = 1; i <= WEEKS; i++) {
    const seg = document.createElement("div");
    seg.className = "seg" + (!isBreak && i < week ? " done" : "") +
                            (!isBreak && i === week ? " current" : "");
    bar.appendChild(seg);
  }
}

render();
// Uuenda iga minut, et vahelehe lahtijätmisel ei jääks eilne seis ekraanile
setInterval(render, 60000);
</script>

</body>
</html>
