name: Study week

on:
  schedule:
    # 03:05 UTC = 06:05 Tallinnas suvel, 05:05 talvel.
    # Cron on alati UTC-s ja GitHub ei arvesta suveaega.
    - cron: "5 3 * * *"
  workflow_dispatch:      # lubab käsitsi käivitada Actions-vahelehelt
  push:
    branches: [main]      # jookseb ka siis, kui sa midagi muudad

permissions:
  contents: write         # ilma selleta ei saa Action commit'ida

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Arvuta õppenädal
        run: python week.py

      - name: Commit, kui midagi muutus
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "Õppenädal uuendatud"
          git push
